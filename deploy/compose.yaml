# Linux host networking keeps Bee and SQLite private to this server.
x-backend: &backend
  image: poros-backend:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  network_mode: host
  env_file: .env
  volumes:
    - ./state:/state
  restart: unless-stopped
  init: true
  logging:
    options:
      max-size: 10m
      max-file: '3'
services:
  api:
    <<: *backend
  membership-worker:
    <<: *backend
    command: [node, apps/web/tooling/membership-worker.mjs]
  bee:
    image: ethersphere/bee:2.8.3
    user: "1000:1000"
    command: [start]
    network_mode: host
    env_file: bee.env
    environment:
      BEE_API_ADDR: '127.0.0.1:1633'
      BEE_DATA_DIR: /home/bee/.bee
      BEE_FULL_NODE: 'false'
      BEE_SWAP_ENABLE: 'true'
      BEE_PASSWORD_FILE: /run/secrets/bee-password
    volumes:
      - ./bee-data:/home/bee/.bee
      - ./bee-password:/run/secrets/bee-password:ro
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: '3'
  https:
    image: caddy:2
    network_mode: host
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
